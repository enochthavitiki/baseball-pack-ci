name: Baseball Pack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests + synthetic-label gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

      - name: Check every outcome is labeled synthetic
        run: python scripts/check_synthetic.py

  docker:
    name: Build image + smoke test container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t baseball-pack:${{ github.sha }} .

      - name: Start container
        run: docker run -d --name pack -p 8080:8080 baseball-pack:${{ github.sha }}

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "Container never became healthy"; docker logs pack; exit 1

      - name: Smoke test /decide returns a synthetic outcome
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8080/decide \
            -H "Content-Type: application/json" \
            -d '{"inning": 8, "outs": 0, "runners": ["first"], "score_diff": -1}')
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['synthetic'] is True and d['recommendation'] == 'SACRIFICE_BUNT'"

      - name: Container logs
        if: always()
        run: docker logs pack || true
